{% extends 'shared/_layout.html' %}

{% block content %}

    <div class="page-title-area">
        <div class="container">
            <div class="page-title-content">
                <ul>
                    <li>
                        <a href="{% url 'home_page' %}">خانه</a>
                    </li>
                    <li class="active">ورود</li>
                </ul>
            </div>
        </div>
    </div>


    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-12">

                <div class="user-form-content mt-5 mb-5 p-4 shadow-sm rounded">

                    <h3 class="text-center mb-4">وارد شوید</h3>

                    <form class="user-form" method="post">
                        {% csrf_token %}

                        <!-- Email -->
                        <div class="form-group mb-3">
                            <label>ایمیل</label>
                            {{ login_form.email }}
                            {{ login_form.email.errors }}
                        </div>

                        <!-- Password -->
                        <div class="form-group mb-3">
                            <label>گذرواژه</label>
                            {{ login_form.password }}
                            {{ login_form.password.errors }}
                        </div>

                        <!-- Submit -->
                        <div class="text-center">
                            <button class="default-btn w-100" type="submit">
                                ورود
                            </button>
                        </div>

                    </form>

                </div>

            </div>
        </div>
    </div>

{% endblock %}
